# Workflow Config — wird durch /dtb:project-init ausgefuellt
# Single Source of Truth fuer alle DTB Commands

project_name: "[Projektname]"
namespace: "[namespace]"

paths:
  workflows: "dtb-project/project-workflows"
  changelog: "dtb-project/project-changelog"

repos:
  - name: "[Repo-Name]"
    path: "."
    type: "[python|typescript|go|rust|...]"
    test_command: null
    build_command: null

idea_triage:
  becken_schwelle: 10   # dtb:workflow-checkpoint — ab N ungesichteten Becken-Eintraegen Handoff-Zeile
  einzeln_pro_lauf: 5   # dtb:idea-triage — Einzelfaelle (Stufe 2) je Lauf; ersetzt den Alt-Schluessel altbestand_pro_lauf (Rueckfall, falls nur er gesetzt ist)

worker:
  max_attempts: 3   # dtb:worker — Versuche pro Task
  max_minutes: 30   # dtb:worker — Minuten pro Task (Anweisungs-Ebene)

parallel:
  default_branch: null  # Worktree-Guard — optional: Branch des Haupt-Checkouts; null = nur Worktree-Check (Verhalten wie ohne Key)

status:
  alter_schwelle_tage: 7  # DERIVED_STATE_RULES §9/§10 — ⏳ fuer offene Aufgaben und Worktrees ab N Tagen

dashboard:
  bei_checkpoint: true  # dtb:workflow-checkpoint Schritt 4b — Dashboard am Session-Ende aktualisieren

lessons:
  schwelle_kb: 80       # dtb:lesson — ab dieser Groesse von lessons.md (KB) Warnung mit Verweis auf dtb:lesson-curate; Dashboard-Fuellstand
  einzeln_pro_lauf: 5   # dtb:lesson-curate — Einzelfaelle je Lauf
